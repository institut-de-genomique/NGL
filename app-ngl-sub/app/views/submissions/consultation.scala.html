@this()
@()
@import views.html.helper._

@formConsultation() = {

	@columnSearchForm{
		@formGroup{
			<div class="form-control" bt-select  ng-model="form.projCodes" filter="true" multiple="true" placeholder='@Messages("consultation.placeholder.projectCodes")' bt-options="project.code as project|formatProjectListLabel for project in lists.getProjects()"></div>	
		}													
		@formGroup{
			<div class="form-control" bt-select ng-model="form.pseudoStateCodes"  filter="true" multiple="true" placeholder='@Messages("consultation.placeholder.pseudoStateCodes")' 
			                          bt-options="pseudoStates.code as pseudoStates.name for pseudoStates in sraVariables.simplifiedStates|orderBy:'code'"></div>			
		}	
	}
	@columnSearchForm{
		@formGroup{
			<bt-input  class="form-control"  input-ng-model="form.accessionRegex" textarea-ng-model="form.accessions" 
			title='@Messages("consultation.textarea-placeholder-title.submissionAccessions")' 
			textarea-placeholder-ng-model='@Messages("consultation.textarea-placeholder-title.submissionAccessions")' 
			placeholder='@Messages("consultation.textarea-placeholder.submissionAccessions")' >
			</bt-input>									
		}	
		@formGroup{
			<bt-input  class="form-control"  input-ng-model="form.codeRegex" textarea-ng-model="form.codes" 
			title='@Messages("consultation.textarea-placeholder-title.submissionCodes")' 
			textarea-placeholder-ng-model='@Messages("consultation.textarea-placeholder-title.submissionCodes")' 
			placeholder='@Messages("consultation.textarea-placeholder.submissionCodes")' >
			</bt-input>									
		}	
	}

	@columnSearchForm{
	
	}
	@columnSearchForm{
		@formGroup{
		<div class="tab-pane active" id="filters">
			<form class="well well-small">
			<div class="row">
			
				<div class="btn-toolbar">
					<button type="submit" title='@Messages("button.search")' data-toggle="tooltip" ng-click="search()" class="btn btn-primary" >
						<i class="fa fa-search"></i>
					</button>
					<button title='@Messages("button.reset")' data-toggle="tooltip" ng-click="reset()"  class="btn btn-default">
						<i class="fa fa-undo"></i>
					</button>						 	
				</div>
				
			</div>		
		</form>	
	</div>
	
		}													
	}
}	
	

<div class="row">
<div class="col-md-12 col-lg-12"  messages="messages"></div>
</div>

@* XXXXXXXX CONSULTATION SUBMISSION XXXXXXXXXXXXXX *@

<div class="row"> 
	<div class="col-md-12 col-lg-12" ultimate-datatable="submissionsDT">
		<div dt-form>	
			<div class="tab-content">
				<div class="tab-pane active" id="filters">
					<form name="submissionForm" class="well well-small">
						<div class="row">
						@formConsultation
						</div>		
					</form>	
				</div>
			</div>
		</div>
	</div>
</div>
